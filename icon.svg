<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <!-- Background: Rounded red rectangle -->
    <rect x="0" y="0" width="120" height="120" rx="24" ry="24" fill="#E74C3C"/>

    <!-- Clock face: White circle -->
    <circle cx="60" cy="60" r="40" fill="white"/>

    <!-- Clock hands (approx 25 minutes) -->
    <!-- Minute hand at 150° (25 min = 150°) -->
    <line x1="60" y1="60" x2="60" y2="28" stroke="#333" stroke-width="2.5" stroke-linecap="round"
          transform="rotate(150 60 60)"/>
    <!-- Hour hand (approx 2:25 position) -->
    <line x1="60" y1="60" x2="60" y2="40" stroke="#333" stroke-width="3.5" stroke-linecap="round"
          transform="rotate(72.5 60 60)"/>

    <!-- Center dot -->
    <circle cx="60" cy="60" r="3" fill="#333"/>

    <!-- Break pulse dot (top right) -->
    <circle cx="90" cy="30" r="7" fill="#2ECC71"/>
</svg>