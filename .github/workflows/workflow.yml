name: Build and Release Alpha DEB Package

on:
  push:
    tags:
      - 'v*alpha*' # Triggers the pipeline only when an alpha tag is pushed

permissions:
  contents: write # Crucial permission allowing the runner to upload the compiled artifact

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libcanberra-gtk3-dev glib-2.0

      - name: Configure CMake
        run: |
          mkdir build
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build Project
        run: cmake --build build

      - name: Generate Debian Package
        run: |
          cd build
          cpack

      - name: Create GitHub Alpha Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          draft: false
          prerelease: true
          body: |
            ### 25+5 Clock Alpha Release
            This is an **Alpha Pre-release** version of the 25+5 Clock application.
            
            #### Assets Included:
            - Compiled `.deb` package file for Debian/Ubuntu systems.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
